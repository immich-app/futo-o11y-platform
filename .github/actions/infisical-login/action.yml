name: Log in to Infisical
description: >-
  Trade the job's GitHub OIDC token for an Infisical access token with the
  Infisical CLI, for the modules' infisical provider (INFISICAL_TOKEN). Needs
  id-token: write, the mesh (Infisical only answers over it) and the CLI on
  PATH (mise).

inputs:
  identity-id:
    description: Infisical machine identity with an OIDC auth method for this repository.
    required: true
  domain:
    description: Infisical instance; also the OIDC audience the identity expects.
    required: false
    default: https://infisical.futo.network

outputs:
  token:
    description: The Infisical access token (masked).
    value: ${{ steps.login.outputs.token }}

runs:
  using: composite
  steps:
    - name: Request the OIDC token
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        INFISICAL_DOMAIN: ${{ inputs.domain }}
      with:
        script: |
          const jwt = await core.getIDToken(process.env.INFISICAL_DOMAIN);
          core.setSecret(jwt);
          core.exportVariable('INFISICAL_JWT', jwt);

    - name: Log in
      id: login
      shell: bash
      env:
        INFISICAL_DOMAIN: ${{ inputs.domain }}
        INFISICAL_MACHINE_IDENTITY_ID: ${{ inputs.identity-id }}
      run: |
        set -euo pipefail
        : "${INFISICAL_MACHINE_IDENTITY_ID:?set the identity-id input}"
        token="$(infisical login --method=oidc-auth --silent --plain)"
        echo "::add-mask::$token"
        echo "token=$token" >> "$GITHUB_OUTPUT"
