name: Connect to NetBird
description: >-
  Install a pinned NetBird client, join the FUTO mesh with the setup key the
  caller read from netbird/cluster (o11y-<env>-ci, so that module must be
  applied first), and wait until a mesh-only URL answers: mesh DNS and routes
  land a little after the client reports connected.

inputs:
  setup-key:
    description: NetBird setup key (plaintext; mask it before passing).
    required: true
  hostname:
    description: Peer hostname to register the runner as.
    required: true
  wait-for-url:
    description: URL that must answer over the mesh before the action returns.
    required: true
  version:
    description: NetBird client version; bump together with the sha256 below.
    required: false
    default: "0.82.1"
  sha256:
    description: >-
      SHA256 of netbird_<version>_linux_amd64.tar.gz, from
      https://github.com/netbirdio/netbird/releases/download/v<version>/netbird_<version>_checksums.txt
    required: false
    default: c8f10b89dfa01b8bcad5ec25b666a83e351be4e22eb784b822478b9326a35423

runs:
  using: composite
  steps:
    # NetBird ships no action and mise has no package, so the release tarball
    # is fetched and checked against the pinned sha256 (never `curl | sh`).
    - name: Install NetBird
      shell: bash
      env:
        NB_VERSION: ${{ inputs.version }}
        NB_SHA256: ${{ inputs.sha256 }}
      run: |
        curl -fsSL --retry 3 --proto '=https' --tlsv1.2 -o "$RUNNER_TEMP/netbird.tar.gz" \
          "https://github.com/netbirdio/netbird/releases/download/v${NB_VERSION}/netbird_${NB_VERSION}_linux_amd64.tar.gz"
        echo "$NB_SHA256  $RUNNER_TEMP/netbird.tar.gz" | sha256sum -c
        sudo tar -xzf "$RUNNER_TEMP/netbird.tar.gz" -C /usr/local/bin netbird
        sudo netbird service install
        sudo netbird service start

    # Returns once the client is connected to management.
    - name: Join NetBird
      shell: bash
      env:
        NB_SETUP_KEY: ${{ inputs.setup-key }}
        NB_HOSTNAME: ${{ inputs.hostname }}
      run: sudo --preserve-env=NB_SETUP_KEY netbird up --management-url https://api.netbird.io --hostname "$NB_HOSTNAME"

    - name: Wait for the mesh
      shell: bash
      env:
        WAIT_FOR_URL: ${{ inputs.wait-for-url }}
      run: curl -fsS --retry 60 --retry-delay 2 --retry-all-errors --max-time 5 -o /dev/null "$WAIT_FOR_URL"
