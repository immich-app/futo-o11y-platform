name: Connect to NetBird
description: >-
  Run the NetBird client mise installed (github:netbirdio/netbird in
  .mise/config.toml), join the FUTO mesh with the setup key the caller read
  from netbird/cluster (o11y-<env>-ci, so that module must be applied first),
  and wait until a mesh-only URL answers: mesh DNS and routes land a little
  after the client reports connected.

inputs:
  setup-key:
    description: NetBird setup key (plaintext; mask it before passing).
    required: true
  hostname:
    description: Peer hostname to register the runner as.
    required: true
  wait-for-url:
    description: URL that must answer over the mesh before the action returns.
    required: true

runs:
  using: composite
  steps:
    # The daemon runs as root, whose PATH has no mise shims, so the installed
    # binary is linked where sudo finds it.
    - name: Start the NetBird service
      shell: bash
      run: |
        sudo ln -sf "$(mise which netbird)" /usr/local/bin/netbird
        sudo netbird service install
        sudo netbird service start

    # Returns once the client is connected to management.
    - name: Join NetBird
      shell: bash
      env:
        NB_SETUP_KEY: ${{ inputs.setup-key }}
        NB_HOSTNAME: ${{ inputs.hostname }}
      run: sudo --preserve-env=NB_SETUP_KEY netbird up --management-url https://api.netbird.io --hostname "$NB_HOSTNAME"

    - name: Wait for the mesh
      shell: bash
      env:
        WAIT_FOR_URL: ${{ inputs.wait-for-url }}
      run: curl -fsS --retry 60 --retry-delay 2 --retry-all-errors --max-time 5 -o /dev/null "$WAIT_FOR_URL"
