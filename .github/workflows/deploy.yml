name: Infra (Terraform)

# On PRs, plans the Terragrunt modules the PR changes and the modules that
# depend on them; manual dispatch (drift check) plans every module. One
# deployment tree drives both environments (ENVIRONMENT selects state + vault),
# so every change plans against both. Applies stay operator-run.
#
# The modules with a onepassword provider reach the bootstrap 1Password Connect
# over the NetBird mesh, so jobs join it with a CI setup key read from the
# netbird/cluster state (o11y-<env>-ci peer).
#
# Prerequisites (out-of-band, once):
#   - Per-env repo secrets OP_TF_O11Y_STAGING_ENV / OP_TF_O11Y_PROD_ENV: the
#     1PASS_TF_SA_O11Y_READ service-account token for each env (stored in the
#     o11y_tf_{staging,prod} vaults). Each needs read on o11y_tf (OVH + TF S3
#     state), its own o11y_tf_<env>, and shared_tf (NetBird, NetBox).
#   - netbird/cluster applied per env (mints the CI setup key).
#   - Re-enable the workflow: gh workflow enable deploy.yml

on:
  pull_request:
    branches: [main]
    paths:
      - "deployment/**"
      - ".mise/**"
      - ".github/actions/netbird-connect/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # The plan job trades its GitHub OIDC token for an Infisical one.
  id-token: write

env:
  TG_NON_INTERACTIVE: "true"
  # mise run installs every missing tool from .mise/config.toml by default, which
  # would undo the short install list below.
  MISE_TASK_RUN_AUTO_INSTALL: "false"

jobs:
  plan:
    name: Plan ${{ matrix.environment }}
    # Fork PRs have no secrets and no mesh access.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [staging, production]
    env:
      ENVIRONMENT: ${{ matrix.environment }}
      TF_VAR_env: ${{ matrix.environment }}
      OP_SERVICE_ACCOUNT_TOKEN: ${{ matrix.environment == 'production' && secrets.OP_TF_O11Y_PROD_ENV || secrets.OP_TF_O11Y_STAGING_ENV }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The plan filter diffs against the base commit, which a shallow clone lacks.
          fetch-depth: 0

      - name: Install 1Password CLI
        uses: 1password/install-cli-action@1a3160d5e9de1ae0803eaa08a88746f5ae3daa50 # v4.1.0

      - name: Setup Mise
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          install_args: --locked opentofu terragrunt

      - name: Init
        run: mise run //deployment:init

      - name: Read the CI mesh setup key from state
        id: nb
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          key=$(mise run //deployment/modules/netbird/cluster:output -- -raw ci_setup_key)
          echo "::add-mask::$key"
          echo "setup-key=$key" >> "$GITHUB_OUTPUT"

      - name: Connect to NetBird
        uses: ./.github/actions/netbird-connect
        with:
          setup-key: ${{ steps.nb.outputs.setup-key }}
          hostname: gha-plan-${{ matrix.environment }}-${{ github.run_id }}

      # Infisical only answers over the mesh. The GitHub OIDC token expires in
      # minutes, so it is traded once for an Infisical access token that lasts
      # the job; the modules' infisical provider reads it from the environment.
      # The identity IDs are Actions variables that core-infra-tf (github/secrets) writes.
      - name: Log in to Infisical
        env:
          INFISICAL_IDENTITY_ID: ${{ matrix.environment == 'production' && vars.INFISICAL_O11Y_CI_PLAN_PROD_ID || vars.INFISICAL_O11Y_CI_PLAN_STAGING_ID }}
        run: |
          set -euo pipefail
          : "${INFISICAL_IDENTITY_ID:?set the INFISICAL_O11Y_CI_PLAN_<ENV>_ID repository variable (core-infra-tf github/secrets)}"
          jwt="$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://infisical.futo.network" | jq -r .value)"
          echo "::add-mask::$jwt"
          # The mesh route to Infisical can come up a little after NetBird reports
          # connected; the JWT is reusable, so the login just retries.
          token="$(jq -n --arg id "$INFISICAL_IDENTITY_ID" --arg jwt "$jwt" '{identityId: $id, jwt: $jwt}' \
            | curl -sSf --retry 10 --retry-all-errors --retry-connrefused --retry-delay 2 \
              -H 'Content-Type: application/json' --data-binary @- \
              https://infisical.futo.network/api/v1/auth/oidc-auth/login | jq -r .accessToken)"
          echo "::add-mask::$token"
          echo "INFISICAL_TOKEN=$token" >> "$GITHUB_ENV"

      # A PR plans the modules it changes plus their dependents; root.hcl marks
      # the files every module depends on, so changing one plans them all. A
      # module the PR deletes is skipped (no --filter-allow-destroy), so destroy
      # it by hand before deleting it.
      - name: Plan
        env:
          TG_FILTER: ${{ github.event_name == 'pull_request' && format('...[{0}...HEAD]', github.event.pull_request.base.sha) || '' }}
        run: mise run //deployment:plan
