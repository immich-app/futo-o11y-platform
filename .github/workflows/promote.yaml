---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Promote

on:
  schedule:
    # Monday 12:00 UTC, one cycle after Renovate's Tuesday base updates have soaked a week.
    - cron: "0 12 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  promote:
    name: Promote staging to production
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # A GitHub App token, not GITHUB_TOKEN, so that the pull request runs the CI workflows.
      - name: Mint a token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.PUSH_O_MATIC_APP_CLIENT_ID }}
          private-key: ${{ secrets.PUSH_O_MATIC_APP_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The pull request body cites the commit that put each change into staging.
          fetch-depth: 0

      - name: Install tools
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          install_args: --locked github:home-operations/flate yq oxfmt

      - name: Promote
        uses: anthropics/claude-code-action@4d75e5f390ee76b2e09c1980ecc99ff3a2e088c8 # v1.0.275
        env:
          FLATE_PATH: .
          FLATE_CACHE_DIR: ${{ runner.temp }}/flate
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ steps.app-token.outputs.token }}
          claude_args: |
            --model claude-opus-5-5
            --allowedTools "Read,Glob,Grep,Edit,Write,Bash(git:*),Bash(gh pr:*),Bash(flate:*),Bash(oxfmt:*),Bash(yq:*)"
          prompt: |
            You promote staging to production in this repository. Read docs/03-cluster-architecture-guide.md
            first, in particular the sections "Environment overrides" and "Promotion". Change files only
            under kubernetes/apps. Open at most one pull request. Do not merge anything.

            How the overlays work: kubernetes/apps/base is the definition both clusters share. Staging runs
            base as it is. Production pins versions in its overlay under kubernetes/apps/production, one
            override per app, and each pin sits under a `# renovate:` comment that names the dependency.

            Do these steps in order.

            1. Promote versions. For every production pin, find the pin of the same dependency in base
               (the base file whose `# renovate:` comment has the same depName, or the OCIRepository whose
               url ends in that depName) and set the production value to the base value: the tag and the
               digest together, or the image reference, or the version. Change nothing else in production,
               and never edit a `# renovate:` comment.

            2. Fold staging overrides into base. A staging override is a file under kubernetes/apps/staging
               that patches an app. It is a candidate only if its header carries a comment of the form
               `# promote-after: YYYY-MM-DD` with a date on or before today. Files without that comment are
               permanent differences between the environments. Never touch them. For each candidate, merge
               the fields it sets into the base document of the same kind and name, in the place where
               those fields belong, and carry over the rationale comments from the staging file. Then
               delete the staging file and its entry in the staging kustomization.yaml. If a production
               override now sets a field to the same value as base, remove that field from the override,
               and remove the override file and its kustomization entry when nothing is left in it.
               Version pins stay in production.

            3. Verify. Run `flate test helmrelease` and `flate test kustomization` and then
               `oxfmt kubernetes`. If a flate test fails, print the failure, change nothing further, and
               stop without opening a pull request.

            4. If `git status` shows no change, stop. Otherwise commit everything as one signed-off
               commit (`git commit -s`) with the message `chore(production): promote staging to
               production`, on the branch `promote/production` from the current main. If a pull request
               from that branch is already open, push to it with `--force-with-lease` and update its body;
               otherwise push the branch and open the pull request with `gh pr create` against main. Title
               `chore(production): promote staging to production (YYYY-MM-DD)` with today's date. Write the
               body in plain English: one short line per version change with the old and the new value,
               and one short paragraph per folded override that names the app, what moved into base, and
               the commit that put it into staging (`git log` on the deleted staging file). Do not mention
               the tooling or the model in the commit message or the body.

            Rules. Keep the YAML style of the files you edit: no anchors, comments only where they explain
            a constraint, and no rewriting of lines you do not need to change. Do not create files outside
            kubernetes/apps. Do not run anything that reaches a cluster.
