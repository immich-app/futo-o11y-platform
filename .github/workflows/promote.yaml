---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Promote

on:
  schedule:
    # Monday 12:00 UTC, one cycle after Renovate's Tuesday base updates have soaked a week.
    - cron: "0 12 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  promote:
    name: Promote staging to production
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # A GitHub App token, not GITHUB_TOKEN, so that the pull request runs the CI workflows.
      - name: Mint a token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.PUSH_O_MATIC_APP_CLIENT_ID }}
          private-key: ${{ secrets.PUSH_O_MATIC_APP_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
          # The pull request body cites the commit that put each change into staging.
          fetch-depth: 0

      - name: Install tools
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          install_args: --locked github:home-operations/flate yq oxfmt

      - name: Promote
        uses: anthropics/claude-code-action@4d75e5f390ee76b2e09c1980ecc99ff3a2e088c8 # v1.0.275
        env:
          FLATE_PATH: .
          FLATE_CACHE_DIR: ${{ runner.temp }}/flate
          # Changed-only mode keeps the unchanged ghcr bundles (anonymous pulls, 429-prone) out of the run.
          FLATE_BASE: main
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ steps.app-token.outputs.token }}
          claude_args: |
            --model claude-opus-5-5
            --allowedTools "Read,Glob,Grep,Edit,Write,Bash(git:*),Bash(gh pr:*),Bash(flate:*),Bash(oxfmt:*),Bash(yq:*)"
            --disallowedTools "Bash(gh pr merge:*)"
          # The procedure is the committed project skill .claude/skills/promote/SKILL.md, which also runs locally as /promote.
          prompt: /promote
