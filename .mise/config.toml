min_version = "2026.11.3"
monorepo_root = true

[monorepo]
config_roots = ["bootstrap", "deployment", "deployment/modules/*/*", "talos"]

[tools]
lefthook = "2.2.2"
opentofu = "1.13.2"
terragrunt = "1.2.1"
pipx = "1.18.14"
"pipx:python-openstackclient" = { version = "10.5.0", uvx = false }
kubectl = "1.37.2"
flux2 = "2.10.0"
talosctl = "1.14.5"
"aqua:postfinance/topf" = "0.6.2"
helm = "4.3.1"
helmfile = "1.8.2"
jq = "1.8.2"
yq = "4.54.2"
kustomize = "5.8.3"
oxfmt = "0.74.0"
zizmor = "1.32.0"
"github:home-operations/flate" = "v0.7.3"
cosign = "3.1.4"

[env]
TF_VAR_dist_dir = "{{config_root}}/dist"
TOPFCONFIG = "{{config_root}}/talos/{{ get_env(name='ENVIRONMENT', default='') }}/topf.yaml"
# topf runs the secretsProvider named in topf.yaml from PATH.
_.path = ["{{config_root}}/talos/bin"]
# Written by //bootstrap:kubeconfig and //talos:talosconfig.
KUBECONFIG = "{{config_root}}/.private/{{ get_env(name='ENVIRONMENT', default='') }}/kubeconfig"
TALOSCONFIG = "{{config_root}}/.private/{{ get_env(name='ENVIRONMENT', default='') }}/talosconfig"

# Maps long env names (development/staging/production) to the short suffixes
# used by 1Password vault paths (dev/staging/prod).
ENVIRONMENT_SHORT = "{% set e = get_env(name='ENVIRONMENT', default='development') %}{% if e == 'development' or e == '' %}dev{% elif e == 'production' %}prod{% else %}{{ e }}{% endif %}"

# Rendered at the root, so {{config_root}} here is the repo root from any subproject.
[vars]
# Shared Grafana dashboards: fetched from upstream and patched for the fleet
# (cluster variable + filters, Fleet datasource, shared folder) by the
# VictoriaMetrics sync-job in generate mode; CI publishes the output.
sync_job = "docker run --rm -e OUTPUT=- -e CONFIG=/config/sync-job.yaml -e NAMESPACE=o11y -e RELEASE=shared -e OWNER_REFERENCES=false -v {{config_root}}/o11y:/config:ro ghcr.io/victoriametrics/sync-job:v0.0.18"
# Pin every datasource-type template variable to the Fleet datasource: the
# sync-job leaves them free, and Grafana would otherwise open a shared board
# on the default (tenant-scoped) datasource and show only this cluster.
pin_fleet = "yq '(select(.kind == \"GrafanaDashboard\") | .spec.json) |= (fromjson | .templating.list[] |= (select(.type == \"datasource\") |= (.regex = \"/^VictoriaMetrics Fleet$/\" | .current = {\"text\": \"VictoriaMetrics Fleet\", \"value\": \"VictoriaMetricsFleet\"})) | tojson)'"
# The sync-job emits the kube-prometheus bundle in map order; sort documents so an unchanged
# upstream renders byte-identical and the artifact's content layer keeps its digest.
sort_docs = "yq eval-all '[.] | sort_by(.metadata.name) | .[] | splitDoc'"
# CI authenticates with a service-account token, which op rejects alongside --account.
op_account = "{% if get_env(name='OP_SERVICE_ACCOUNT_TOKEN', default='') == '' %}--account 'team-futo.1password.com' {% endif %}"
# The onepassword provider treats an OP_SERVICE_ACCOUNT_TOKEN in its environment
# as a credential that conflicts with the explicit Connect ones, so op run keeps
# it for itself and terragrunt runs without it.
tg = "op run {{vars.op_account}}'--env-file={{config_root}}/deployment/.env' -- env -u OP_SERVICE_ACCOUNT_TOKEN terragrunt"

# Escape hatch for terragrunt subcommands the tasks below don't cover
# (state rm/import/force-unlock, ...); operates on the caller's directory.
[tasks.tg]
run = "{{vars.tg}}"
description = "Wrapper for terragrunt"
dir = "{{cwd}}"

# Module tasks extend these; each runs in its own module directory. Caller args
# append after the verb and land in tofu's argv (terragrunt run -- plan -target=...).
# apply/destroy in the module files carry wait_for mirroring the terragrunt
# dependency blocks, so wildcard fan-outs like //deployment/modules/...:apply
# cannot run out of dependency order.
[task_templates."tg:init"]
run = "{{vars.tg}} run -- init -reconfigure"
description = "Init this module"

[task_templates."tg:plan"]
run = "{{vars.tg}} run -- plan"
description = "Plan this module"

[task_templates."tg:apply"]
run = "{{vars.tg}} run -- apply"
description = "Apply this module"

[task_templates."tg:destroy"]
run = "{{vars.tg}} run -- destroy"
description = "Destroy this module"

[task_templates."tg:output"]
run = "{{vars.tg}} run -- output"
description = "Read outputs from this module"

# Paths are explicit because oxfmt honours only .gitignore and .prettierignore,
# not the global excludes that hide .private/.
[tasks.fmt]
depends = ["//deployment:fmt"]
run = "oxfmt bootstrap deployment docs kubernetes o11y talos .github README.md renovate.json"
description = "Format markdown, YAML, JSON, Terraform and Terragrunt files in place"

[tasks."fmt:check"]
depends = ["//deployment:fmt:check"]
run = "oxfmt --check bootstrap deployment docs kubernetes o11y talos .github README.md renovate.json"
description = "Verify markdown, YAML, JSON, Terraform and Terragrunt files are formatted"

[tasks."o11y:render"]
run = "{{vars.sync_job}} | {{vars.pin_fleet}} | {{vars.sort_docs}} > {{config_root}}/o11y/manifests/dashboards.yaml"
description = "Render o11y/manifests/dashboards.yaml (git-ignored) from the upstream sources in o11y/sync-job.yaml"

[settings]
idiomatic_version_file_enable_tools = []

[hooks]
postinstall = "lefthook install"
