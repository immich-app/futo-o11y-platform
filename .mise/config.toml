min_version = "2026.11.3"
monorepo_root = true

[monorepo]
config_roots = ["bootstrap", "o11y", "terraform", "terraform/*", "talos"]

[tools]
lefthook = "2.2.2"
opentofu = "1.13.9"
terragrunt = "1.2.1"
kubectl = "1.37.2"
flux2 = "2.10.0"
talosctl = "1.14.5"
"aqua:postfinance/topf" = "0.6.2"
helm = "4.3.1"
helmfile = "1.8.2"
jq = "1.8.2"
yq = "4.54.2"
kustomize = "5.8.3"
oxfmt = "0.74.0"
zizmor = "1.32.0"
shellcheck = "0.11.0"
"github:home-operations/flate" = "v0.7.3"
# The CI plan job's mesh client; not in the registry, and operators run their own.
"github:netbirdio/netbird" = { version = "v0.82.1", os = ["linux"] }
cosign = "3.1.4"
infisical = "0.45.4"

[env]
TF_VAR_dist_dir = "{{config_root}}/dist"
TOPFCONFIG = "{{config_root}}/talos/{{ get_env(name='ENVIRONMENT', default='') }}/topf.yaml"
# topf runs the secretsProvider named in topf.yaml from PATH.
_.path = ["{{config_root}}/talos/bin"]
# Written by //bootstrap:kubeconfig and //talos:talosconfig.
KUBECONFIG = "{{config_root}}/.private/{{ get_env(name='ENVIRONMENT', default='') }}/kubeconfig"
TALOSCONFIG = "{{config_root}}/.private/{{ get_env(name='ENVIRONMENT', default='') }}/talosconfig"
# The FUTO Infisical instance, for the CLI (INFISICAL_DOMAIN) and the modules'
# infisical provider (INFISICAL_HOST); CI's workflow reads it too.
INFISICAL_DOMAIN = "https://infisical.futo.network"
INFISICAL_HOST = "{{ env.INFISICAL_DOMAIN }}"
# The infisical CLI's default project: observability. Reads of the shared
# project pass --projectId.
INFISICAL_PROJECT_ID = "{{ vars.infisical_observability }}"

# The Infisical environment slug of $ENVIRONMENT, for task scripts.
ENVIRONMENT_SHORT = "{{ vars.env_short }}"
# The modules' env variable and root.hcl's state key and working directory.
TF_VAR_env = "{{ get_env(name='ENVIRONMENT', default='') }}"

[vars]
# Maps the env names (staging/production) to the Infisical environment slugs
# (staging/prod).
env_short = "{% set e = get_env(name='ENVIRONMENT', default='') %}{% if e == 'production' %}prod{% else %}{{ e }}{% endif %}"
# Infisical project IDs (core-infra-tf infisical/instance).
infisical_observability = "12d6474a-148e-4170-ae08-e24e1232a116"
infisical_shared = "fe818c25-3e88-4d62-914e-df845b95c535"
# INFISICAL_TOKEN for `infisical run` and the modules' infisical provider: CI
# exports it from its OIDC login; otherwise the operator's `infisical login`
# session supplies it (and starts the login when there is none).
infisical_env = "{% if get_env(name='INFISICAL_TOKEN', default='') == '' %}INFISICAL_TOKEN=\"$(infisical user get token --plain)\" {% endif %}"
# Without ENVIRONMENT there is no Infisical environment and no state key, so
# every terragrunt task fails first instead.
environment_guard = ": \"${ENVIRONMENT:?set ENVIRONMENT=staging (or production) first}\"; "
# Terragrunt gets the shared project's global /tf first, then this
# environment's /tf of the observability project (which imports its global
# /tf and wins on a name both hold). core-infra-tf lets the o11y identities read
# their shared names in global only, so that run cannot use env_short.
# root.hcl maps the names to the module inputs and the state backend.
# --log-level keeps a LOG_LEVEL=debug meant for another tool from making
# infisical log every secret it injects. infisical run exits 1 for any failed
# command, so terragrunt's other exit codes (plan -detailed-exitcode) are lost.
tg = "{{vars.environment_guard}}{{vars.infisical_env}}infisical run --silent --log-level warn --projectId {{vars.infisical_shared}} --env global --path /tf -- infisical run --silent --log-level warn --projectId {{vars.infisical_observability}} --env {{vars.env_short}} --path /tf -- terragrunt"

# Escape hatch for terragrunt subcommands the tasks below don't cover
# (state rm/import/force-unlock, ...); operates on the caller's directory.
[tasks.tg]
run = "{{vars.tg}}"
description = "Wrapper for terragrunt"
dir = "{{cwd}}"

# Module tasks extend these; each runs in its own module directory. Caller args
# append after the verb and land in tofu's argv (terragrunt run -- plan -target=...).
# apply/destroy in the module files carry wait_for mirroring the terragrunt
# dependency blocks, so several module tasks in one run
# (mise run //terraform/netbox:apply ::: //terraform/ovh:apply) cannot run out
# of dependency order. //terraform/...:apply also matches //terraform:apply,
# which applies every module again in parallel; use //terraform:apply alone.
[task_templates."tg:init"]
run = "{{vars.tg}} run -- init -reconfigure"
description = "Init this module"

[task_templates."tg:plan"]
run = "{{vars.tg}} run -- plan"
description = "Plan this module"

[task_templates."tg:apply"]
run = "{{vars.tg}} run -- apply"
description = "Apply this module"

[task_templates."tg:destroy"]
run = "{{vars.tg}} run -- destroy"
description = "Destroy this module"

[task_templates."tg:output"]
run = "{{vars.tg}} run -- output"
description = "Read outputs from this module"

# Paths are explicit because oxfmt honours only .gitignore and .prettierignore,
# not the global excludes that hide .private/.
[tasks.fmt]
depends = ["//terraform:fmt"]
run = "oxfmt bootstrap terraform docs kubernetes o11y talos .github README.md renovate.json"
description = "Format markdown, YAML, JSON, Terraform and Terragrunt files in place"

[tasks."fmt:check"]
depends = ["//terraform:fmt:check"]
run = "oxfmt --check bootstrap terraform docs kubernetes o11y talos .github README.md renovate.json"
description = "Verify markdown, YAML, JSON, Terraform and Terragrunt files are formatted"

[settings]
idiomatic_version_file_enable_tools = []

[hooks]
postinstall = "lefthook install"
