---
# yaml-language-server: $schema=https://json.schemastore.org/helmfile
# Chart, version and values come from the Flux apps in kubernetes/apps
# (production pins included), so Flux then takes over the same releases
# unchanged.
environments:
  staging: {}
  production: {}
---
templates:
  default:
    chart: '{{ (readFile (printf "../kubernetes/apps/base/%s/app/ocirepository.yaml" .Release.Name) | fromYaml).spec.url }}'
    version: '{{ tpl (readFile "templates/version.gotmpl") . | trim }}'
    values:
      - templates/values.yaml.gotmpl
