---
# yaml-language-server: $schema=https://json.schemastore.org/helmfile
# Installs what Flux needs before it can reconcile: CoreDNS, the Flux Operator
# and the FluxInstance. Chart, version and values come from the Flux apps in
# kubernetes/apps (production pins included), so Flux then takes over the
# same releases unchanged. Run through `mise run //bootstrap:apps`.
environments:
  staging: {}
  production: {}
---
helmDefaults:
  cleanupOnFail: true
  forceConflicts: true
  wait: true
  waitForJobs: true

templates:
  default:
    chart: '{{ (fromYaml (tpl (readFile "templates/release.yaml.gotmpl") .)).chart }}'
    version: '{{ (fromYaml (tpl (readFile "templates/release.yaml.gotmpl") .)).version }}'
    values:
      - templates/values.yaml.gotmpl

releases:
  - name: coredns
    namespace: kube-system
    inherit:
      - template: default

  - name: flux-operator
    namespace: flux-system
    inherit:
      - template: default
    needs:
      - kube-system/coredns

  - name: flux-instance
    namespace: flux-system
    inherit:
      - template: default
    needs:
      - flux-system/flux-operator
