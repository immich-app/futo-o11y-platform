---
# yaml-language-server: $schema=https://json.schemastore.org/helmfile
# Installs what Flux needs before it can reconcile: CoreDNS, the Flux Operator
# and the FluxInstance. Run through `mise run //bootstrap:apps`.
bases:
  - defaults.yaml
---
helmDefaults:
  cleanupOnFail: true
  forceConflicts: true
  wait: true
  waitForJobs: true

releases:
  - name: coredns
    namespace: kube-system
    inherit:
      - template: default

  - name: flux-operator
    namespace: flux-system
    inherit:
      - template: default
    needs:
      - kube-system/coredns

  - name: flux-instance
    namespace: flux-system
    inherit:
      - template: default
    needs:
      - flux-system/flux-operator
