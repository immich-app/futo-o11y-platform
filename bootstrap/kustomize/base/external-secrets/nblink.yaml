---
# Setup key of the nblink sidecar in the External Secrets controller
# (netbird/cluster writes it to <env>:/tf). External Secrets reaches Infisical
# through that sidecar, so it cannot fetch this key itself.
apiVersion: v1
kind: Secret
metadata:
  name: nblink-setup-key
stringData:
  setup-key: ${NETBIRD_EXTERNAL_SECRETS_SETUP_KEY}
