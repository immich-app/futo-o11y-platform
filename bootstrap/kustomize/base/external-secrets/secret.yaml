---
# Universal Auth client credentials of the cluster's Infisical identity
# (k8s-o11y-<env>, published by core-infra-tf in <env>:/ci as
# INFISICAL_K8S_CLIENT_*_<CLUSTER>; the overlay names the cluster). The
# Infisical ClusterSecretStores log in with them.
apiVersion: v1
kind: Secret
metadata:
  name: infisical-universal-auth
stringData:
  clientId: ""
  clientSecret: ""
