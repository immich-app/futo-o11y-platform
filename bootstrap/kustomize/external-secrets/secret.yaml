---
# Universal Auth client credentials of the cluster's Infisical identity
# (k8s-o11y-<env>, published by core-infra-tf in <env>:/ci); the Infisical
# ClusterSecretStores log in with them.
apiVersion: v1
kind: Secret
metadata:
  name: infisical-universal-auth
stringData:
  clientId: ${INFISICAL_K8S_CLIENT_ID}
  clientSecret: ${INFISICAL_K8S_CLIENT_SECRET}
