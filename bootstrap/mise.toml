# Run it after the nodes have their machine configuration
# (docs/01-bootstrap-guide.md). The kubeconfig stays on the first control
# plane: Flux brings up the mesh gateway later, and
# `mise run //bootstrap:kubeconfig` then switches to the mesh endpoint.
[tasks.cluster]
description = "Bootstrap $ENVIRONMENT after the nodes are configured: etcd, kubeconfig, Flux prerequisites, Flux"
confirm = "Bootstrap o11y-{{ get_env(name='ENVIRONMENT', default='') }}?"
run = [
  { task = "etcd" },
  { task = "kubeconfig", args = ["--direct"] },
  { task = "ready" },
  { task = "resources" },
  { task = "crds" },
  { task = "apps" },
]

[tasks.etcd]
description = "Bootstrap etcd on $ENVIRONMENT's first control plane (waits until it is up)"
depends = ["//talos:talosconfig"]
run = '''
#!/usr/bin/env bash
# Reaches the first control plane on its private IP, so the operator's NetBird
# route to the vRack must work.
set -euo pipefail
: "${ENVIRONMENT:?set ENVIRONMENT=staging (or production) first}"

cp="$(yq '.data.controlplaneIps[0]' "$TOPFCONFIG")"
deadline=$((SECONDS + 1200))
until out="$(talosctl --nodes "$cp" --endpoints "$cp" bootstrap 2>&1)" || [[ "$out" == *AlreadyExists* ]]; do
  if ((SECONDS > deadline)); then
    echo "etcd bootstrap on $cp did not succeed within 20 minutes: $out" >&2
    exit 1
  fi
  echo "etcd bootstrap on $cp: $out; checking again in 5s"
  sleep 5
done
echo "etcd is bootstrapped on $cp"
'''

[tasks.kubeconfig]
description = "Write a 12h admin kubeconfig for $ENVIRONMENT to $KUBECONFIG"
usage = 'flag "--direct" help="Use the first control plane instead of the mesh endpoint"'
run = '''
#!/usr/bin/env bash
# --direct is for bootstrap and DR, before the mesh gateway exists. TLS works on
# both endpoints: every control-plane IP is an apiserver cert SAN.
set -euo pipefail
: "${ENVIRONMENT:?set ENVIRONMENT=staging (or production) first}"

if [[ "${usage_direct:-false}" == true ]]; then
  host="$(yq '.data.controlplaneIps[0]' "$TOPFCONFIG")"
else
  host="kube.$(yq '.data.meshDnsZone' "$TOPFCONFIG")"
fi

umask 077
mkdir -p "$(dirname "$KUBECONFIG")"
config="$(topf kubeconfig)"
printf '%s\n' "$config" >"$KUBECONFIG"
kubectl config set-cluster "o11y-$ENVIRONMENT" --server "https://$host:6443"
kubectl config rename-context "topf@o11y-$ENVIRONMENT" "o11y-$ENVIRONMENT"
'''

[tasks.ready]
description = "Wait until every $ENVIRONMENT node is registered and Ready"
run = '''
#!/usr/bin/env bash
# Waits for each node in topf.yaml by name, so a node that never joins (for
# example one without a machine configuration) fails the wait and is named.
set -euo pipefail
: "${ENVIRONMENT:?set ENVIRONMENT=staging (or production) first}"

deadline=$((SECONDS + 1200))
until kubectl get --raw /readyz --request-timeout=10s >/dev/null 2>&1; do
  if ((SECONDS > deadline)); then
    echo "kube-apiserver did not answer within 20 minutes" >&2
    exit 1
  fi
  echo "waiting for kube-apiserver"
  sleep 5
done

for host in $(yq '.nodes[].host' "$TOPFCONFIG"); do
  kubectl wait --for=create "node/$host" --timeout=20m
done
kubectl wait nodes --all --for=condition=Ready --timeout=15m
'''

[tasks.resources]
description = "Apply the namespaces, Secrets and bootstrap-settings ConfigMap Flux needs to $ENVIRONMENT"
run = [
  '''
#!/usr/bin/env bash
# kustomize/ holds the manifests with ${...} placeholders; infisical run puts
# the observability project's <env>:/tf (which imports global) and <env>:/ci
# into the environment and flux envsubst fills them in, failing on a missing
# one. The client credentials carry the cluster name in Infisical and the
# Connect token's name is no shell variable name, so they are mapped to the
# placeholder names first. Needs an `infisical login` session on the mesh.
set -euo pipefail
: "${ENVIRONMENT:?set ENVIRONMENT=staging (or production) first}"
export INFISICAL_DOMAIN="${INFISICAL_DOMAIN:-https://infisical.futo.network}"

project_id="$(infisical secrets-manager projects get observability -o json --silent | jq -er .id)"
kustomize build kustomize | infisical run --silent --projectId "$project_id" --env "$ENVIRONMENT_SHORT" --path /tf --path /ci -- sh -c '
  set -eu
  cluster="O11Y_$(printf "%s" "$ENVIRONMENT_SHORT" | tr "[:lower:]" "[:upper:]")"
  INFISICAL_K8S_CLIENT_ID="$(printenv "INFISICAL_K8S_CLIENT_ID_$cluster" || true)"
  INFISICAL_K8S_CLIENT_SECRET="$(printenv "INFISICAL_K8S_CLIENT_SECRET_$cluster" || true)"
  ONEPASSWORD_CONNECT_TOKEN="$(printenv 1PASS_CONNECT_O11Y_READ || true)"
  : "${INFISICAL_K8S_CLIENT_ID:?INFISICAL_K8S_CLIENT_ID_$cluster is not in observability $ENVIRONMENT_SHORT:/ci (core-infra-tf infisical/instance)}"
  : "${INFISICAL_K8S_CLIENT_SECRET:?INFISICAL_K8S_CLIENT_SECRET_$cluster is not in observability $ENVIRONMENT_SHORT:/ci (core-infra-tf infisical/instance)}"
  : "${ONEPASSWORD_CONNECT_TOKEN:?1PASS_CONNECT_O11Y_READ is not in observability $ENVIRONMENT_SHORT:/tf}"
  export INFISICAL_K8S_CLIENT_ID INFISICAL_K8S_CLIENT_SECRET ONEPASSWORD_CONNECT_TOKEN
  flux envsubst --strict
' | kubectl apply --server-side --force-conflicts --filename -
''',
  "mise run //deployment/modules/netbird/cluster:output -- -raw bootstrap_settings | kubectl apply --server-side --force-conflicts --filename -",
]

[tasks.crds]
description = "Create the CRDs that other apps consume on $ENVIRONMENT, before Flux starts"
run = '''
#!/usr/bin/env bash
# Flux installs the charts later and takes over these CRDs. Existing CRDs
# belong to Flux, so a rerun, even from an older checkout, never changes them.
set -euo pipefail
: "${ENVIRONMENT:?set ENVIRONMENT=staging (or production) first}"

crds="$(helmfile --quiet --file crds.yaml --environment "$ENVIRONMENT" template --include-crds --skip-deps |
  yq eval-all --exit-status 'select(.kind == "CustomResourceDefinition")')"
existing="$(kubectl get crd --output jsonpath='{.items[*].metadata.name}')"
missing="$(EXISTING="$existing" yq eval-all \
  'select([.metadata.name] - (strenv(EXISTING) | split(" ")) | length > 0)' <<<"$crds")"

if [[ -n "$missing" ]]; then
  kubectl create --filename - <<<"$missing"
else
  echo "every CRD exists"
fi
'''

[tasks.apps]
description = "Install CoreDNS, the Flux Operator and the FluxInstance on $ENVIRONMENT (helmfile sync)"
run = 'helmfile --environment "$ENVIRONMENT" sync --hide-notes'
