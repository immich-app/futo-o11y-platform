# Run it after the nodes have their machine configuration
# (docs/01-bootstrap-guide.md). The kubeconfig stays on the first control
# plane: Flux brings up the mesh gateway later, and
# `mise run //bootstrap:kubeconfig` then switches to the mesh endpoint.
[tasks.cluster]
description = "Bootstrap $ENVIRONMENT after the nodes are configured: etcd, kubeconfig, Flux prerequisites, Flux"
confirm = "Bootstrap o11y-{{ get_env(name='ENVIRONMENT', default='') }}?"
run = [
  { task = "etcd" },
  { task = "kubeconfig", args = ["--direct"] },
  { task = "ready" },
  { task = "resources" },
  { task = "crds" },
  { task = "apps" },
]

[tasks.apps]
description = "Install CoreDNS, the Flux Operator and the FluxInstance on $ENVIRONMENT (helmfile sync)"
run = 'helmfile --environment "$ENVIRONMENT" sync --hide-notes'
