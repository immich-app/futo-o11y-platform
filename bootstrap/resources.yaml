---
# Namespaces and secrets that Flux needs on its first reconcile, applied by
# `mise run //bootstrap:resources`. op inject fills the op:// references from
# 1Password, and ENVIRONMENT_SHORT comes from the root mise env.
apiVersion: v1
kind: Namespace
metadata:
  name: cert-manager
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
---
apiVersion: v1
kind: Namespace
metadata:
  name: external-secrets
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
---
apiVersion: v1
kind: Namespace
metadata:
  name: flux-system
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
---
apiVersion: v1
kind: Namespace
metadata:
  name: netbird
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
---
# OVH DNS-01 credentials for cert-manager-webhook-ovh.
apiVersion: v1
kind: Secret
metadata:
  name: ovh-credentials
  namespace: cert-manager
stringData:
  applicationKey: "{{ op://o11y_tf/OVH_APPLICATION_KEY/password }}"
  applicationSecret: "{{ op://o11y_tf/OVH_APPLICATION_SECRET/password }}"
  applicationConsumerKey: "{{ op://o11y_tf/OVH_CONSUMER_KEY/password }}"
---
# 1Password Connect token for the ClusterSecretStore.
apiVersion: v1
kind: Secret
metadata:
  name: onepassword-connect-environment
  namespace: external-secrets
stringData:
  token: "{{ op://o11y_tf_$ENVIRONMENT_SHORT/1PASS_CONNECT_O11Y_READ/password }}"
---
# Enrolment key for the netbird-router pods.
apiVersion: v1
kind: Secret
metadata:
  name: netbird-setup-key
  namespace: netbird
stringData:
  setupKey: "{{ op://o11y_tf_$ENVIRONMENT_SHORT/NETBIRD_K8S_ROUTING_PEER_SETUP_KEY/password }}"
