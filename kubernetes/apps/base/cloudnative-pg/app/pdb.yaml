---
# Keep one operator replica, and with it the admission webhooks, up during node drains.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: cloudnative-pg
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudnative-pg
      app.kubernetes.io/instance: cloudnative-pg
