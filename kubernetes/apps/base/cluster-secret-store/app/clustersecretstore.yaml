---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/clustersecretstore_v1.json
# Both stores log in with the cluster's Universal Auth client credentials
# (k8s-o11y-<env> in core-infra-tf), which //bootstrap:resources applies.
# /tf of the environment imports the project's global /tf, so one store
# covers the o11y_tf and o11y_tf_<env> items alike.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: infisical
spec:
  provider:
    infisical:
      hostAPI: https://infisical.futo.network
      auth:
        universalAuthCredentials:
          clientId:
            name: infisical-universal-auth
            namespace: external-secrets
            key: clientId
          clientSecret:
            name: infisical-universal-auth
            namespace: external-secrets
            key: clientSecret
      secretsScope:
        projectSlug: observability
        environmentSlug: ${CLUSTER_ENV}
        secretsPath: /tf
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/clustersecretstore_v1.json
# Credentials other FUTO products share with this cluster; the identity may
# read only the names core-infra-tf lists for it (kubernetes_shared_secrets).
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: infisical-shared
spec:
  provider:
    infisical:
      hostAPI: https://infisical.futo.network
      auth:
        universalAuthCredentials:
          clientId:
            name: infisical-universal-auth
            namespace: external-secrets
            key: clientId
          clientSecret:
            name: infisical-universal-auth
            namespace: external-secrets
            key: clientSecret
      secretsScope:
        projectSlug: shared
        environmentSlug: ${CLUSTER_ENV}
        secretsPath: /tf
