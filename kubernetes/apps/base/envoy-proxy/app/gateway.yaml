---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.networking.k8s.io/gateway_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: envoy
  annotations:
    # external-dns points each route host at this name, which the OVH module
    # points at the IPLB. external-dns 0.22 and later ignore the old
    # external-dns.alpha.kubernetes.io/ prefix and fall back to the Gateway's
    # status addresses, which are private node IPs.
    external-dns.kubernetes.io/target: ${CLUSTER_APP_DOMAIN}
    gatus.home-operations.com/endpoint: |-
      group: external
spec:
  gatewayClassName: envoy
  listeners:
    - name: https
      protocol: HTTPS
      port: 30443
      allowedRoutes:
        namespaces:
          from: All
      tls:
        certificateRefs:
          - kind: Secret
            name: futostatus-com-tls
