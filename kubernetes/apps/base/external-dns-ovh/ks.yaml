---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: external-dns-ovh
  namespace: flux-system
spec:
  dependsOn:
    - name: cluster-secret-store
    # Installs the Gateway API CRDs that this instance watches.
    - name: envoy-gateway
    # The public Gateway and its target annotation. Without the annotation,
    # external-dns points the hosts at the Gateway's status address instead.
    - name: envoy-proxy
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: external-dns-ovh
      namespace: external-dns
  interval: 1h
  path: ./kubernetes/apps/base/external-dns-ovh/app
  patches: []
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
