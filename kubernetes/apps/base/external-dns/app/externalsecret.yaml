---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# The token of the o11y-<env>-external-dns NetBird service user, which
# netbird/cluster creates and writes to <env>:/tf.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: external-dns-netbird
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: external-dns-netbird
  data:
    - secretKey: NETBIRD_API_TOKEN
      remoteRef:
        key: NETBIRD_EXTERNAL_DNS_API_TOKEN
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# The OVH API credentials (in the project's global /tf), the same ones the
# DNS-01 solver of cert-manager uses.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: external-dns-ovh
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: external-dns-ovh
  data:
    - secretKey: OVH_APPLICATION_KEY
      remoteRef:
        key: OVH_APPLICATION_KEY
    - secretKey: OVH_APPLICATION_SECRET
      remoteRef:
        key: OVH_APPLICATION_SECRET
    - secretKey: OVH_CONSUMER_KEY
      remoteRef:
        key: OVH_CONSUMER_KEY
