---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: external-dns
  namespace: flux-system
spec:
  dependsOn:
    - name: cluster-secret-store
    # Installs the Gateway API CRDs that both instances watch.
    - name: envoy-gateway
    # The Gateways and their target annotations. Without an annotation,
    # external-dns points the hosts at the Gateway's status address instead.
    - name: envoy-proxy
    - name: mesh-gateway
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: external-dns-netbird
      namespace: envoy-system
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: external-dns-ovh
      namespace: envoy-system
  interval: 1h
  path: ./kubernetes/apps/base/external-dns/app
  patches: []
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
