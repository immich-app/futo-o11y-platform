---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-secrets
spec:
  chartRef:
    kind: OCIRepository
    name: external-secrets
  interval: 1h
  values:
    # Resolve DNS via the CoreDNS futo.network zone. CNI installs the
    # attachment's routes at pod creation, so the route list rides along as an
    # annotation and a change to it rolls the pods.
    podAnnotations:
      k8s.v1.cni.cncf.io/networks: kube-system/netbird-egress
      o11y.futo.network/mesh-egress-routes: ${CLUSTER_BOOTSTRAP_SERVICE_CIDR}
    serviceMonitor:
      enabled: true
    # The validating webhook gates every ExternalSecret/SecretStore apply. With one replica a
    # node drain left Flux dry-runs failing ("connection refused") until the next hourly
    # reconcile. The chart fills in the spread constraint's label selector.
    webhook:
      replicaCount: 2
      podDisruptionBudget:
        enabled: true
        minAvailable: 1
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
