---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/generators.external-secrets.io/password_v1alpha1.json
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: glitchtip-postgres
spec:
  length: 48
  digits: 8
  symbols: 0
  noUpper: false
  allowRepeat: true
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/pushsecret_v1alpha1.json
# Seeds Infisical from the generator only while the secret does not exist there.
# Infisical holds the value from then on, so a rebuilt cluster that restores
# the database reads the matching password back.
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: glitchtip-postgres
spec:
  updatePolicy: IfNotExists
  secretStoreRefs:
    - kind: ClusterSecretStore
      name: infisical
  selector:
    generatorRef:
      apiVersion: generators.external-secrets.io/v1alpha1
      kind: Password
      name: glitchtip-postgres
  data:
    - match:
        secretKey: password
        remoteRef:
          remoteKey: /k8s/GLITCHTIP_POSTGRES_PASSWORD
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# No symbols in the password, so it needs no escaping in uri, which GlitchTip
# reads as DATABASE_URL.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: glitchtip-postgres-credentials
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: glitchtip-postgres-credentials
    template:
      type: kubernetes.io/basic-auth
      data:
        username: glitchtip
        password: "{{ .password }}"
        uri: "postgres://glitchtip:{{ .password }}@glitchtip-postgres-rw.o11y.svc.cluster.local:5432/glitchtip?sslmode=require&connect_timeout=10"
  data:
    - secretKey: password
      remoteRef:
        key: /k8s/GLITCHTIP_POSTGRES_PASSWORD
