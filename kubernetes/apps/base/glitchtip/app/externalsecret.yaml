---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/generators.external-secrets.io/password_v1alpha1.json
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: glitchtip-secret-key
spec:
  length: 64
  digits: 10
  symbols: 0
  noUpper: false
  allowRepeat: true
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/pushsecret_v1alpha1.json
# Seeds Infisical from the generator only while the secret does not exist there.
# Infisical holds the value from then on, so a rebuilt cluster reads the same
# key back: Django signs sessions with it, and a new one logs everyone out.
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: glitchtip-secret-key
spec:
  updatePolicy: IfNotExists
  secretStoreRefs:
    - kind: ClusterSecretStore
      name: infisical
  selector:
    generatorRef:
      apiVersion: generators.external-secrets.io/v1alpha1
      kind: Password
      name: glitchtip-secret-key
  data:
    - match:
        secretKey: password
        remoteRef:
          remoteKey: /k8s/GLITCHTIP_SECRET_KEY
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: glitchtip-secret-key
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: glitchtip-secret-key
    template:
      data:
        SECRET_KEY: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: /k8s/GLITCHTIP_SECRET_KEY
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: glitchtip-s3
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: glitchtip-s3
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: GLITCHTIP_S3_ACCESS_KEY_ID
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: GLITCHTIP_S3_SECRET_ACCESS_KEY
