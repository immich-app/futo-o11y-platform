---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/generators.external-secrets.io/password_v1alpha1.json
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: grafana-postgres-superuser-password
spec:
  length: 48
  digits: 8
  symbols: 0
  noUpper: false
  allowRepeat: true
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/pushsecret_v1alpha1.json
# Seeds Infisical from the generator only while the secret does not exist there.
# Infisical holds the value from then on, so a rebuilt cluster that restores
# the database reads the matching password back.
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: grafana-postgres-superuser-password
spec:
  updatePolicy: IfNotExists
  secretStoreRefs:
    - kind: ClusterSecretStore
      name: infisical
  selector:
    generatorRef:
      apiVersion: generators.external-secrets.io/v1alpha1
      kind: Password
      name: grafana-postgres-superuser-password
  data:
    - match:
        secretKey: password
        remoteRef:
          remoteKey: /k8s/GRAFANA_POSTGRES_SUPERUSER_PASSWORD
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-postgres-superuser-password
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: grafana-postgres-superuser-password
    template:
      type: kubernetes.io/basic-auth
      data:
        username: postgres
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: /k8s/GRAFANA_POSTGRES_SUPERUSER_PASSWORD
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/generators.external-secrets.io/password_v1alpha1.json
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: grafana-postgres-password
spec:
  length: 48
  digits: 8
  symbols: 0
  noUpper: false
  allowRepeat: true
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/pushsecret_v1alpha1.json
# Seeds Infisical from the generator only while the secret does not exist there.
# Infisical holds the value from then on, so a rebuilt cluster that restores
# the database reads the matching password back.
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: grafana-postgres-password
spec:
  updatePolicy: IfNotExists
  secretStoreRefs:
    - kind: ClusterSecretStore
      name: infisical
  selector:
    generatorRef:
      apiVersion: generators.external-secrets.io/v1alpha1
      kind: Password
      name: grafana-postgres-password
  data:
    - match:
        secretKey: password
        remoteRef:
          remoteKey: /k8s/GRAFANA_POSTGRES_PASSWORD
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-postgres-password
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: grafana-postgres-password
    template:
      type: kubernetes.io/basic-auth
      data:
        username: grafana
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: /k8s/GRAFANA_POSTGRES_PASSWORD
