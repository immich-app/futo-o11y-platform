---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/grafana.integreatly.org/grafanaserviceaccount_v1beta1.json
# Service account for Rootly's Grafana integration (Integrations > Grafana in
# Rootly), which has no API: it is installed by hand with the Grafana URL and
# the token below, read from Infisical. Rootly holds one Grafana integration,
# which points at production, so only the production overlay includes this
# app. Rootly needs Admin to take dashboard snapshots during incidents.
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaServiceAccount
metadata:
  name: rootly
spec:
  instanceName: grafana
  name: rootly
  role: Admin
  tokens:
    - name: rootly-integration
      secretName: grafana-rootly-token
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/pushsecret_v1alpha1.json
# Replace (the default), so a token the operator mints again replaces the copy
# in Infisical. Install that new token in Rootly afterwards.
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: grafana-rootly-token
spec:
  secretStoreRefs:
    - kind: ClusterSecretStore
      name: infisical
  selector:
    secret:
      name: grafana-rootly-token
  data:
    - match:
        secretKey: token
        remoteRef:
          remoteKey: /k8s/ROOTLY_GRAFANA_SERVICE_ACCOUNT_TOKEN
