---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/generators.external-secrets.io/password_v1alpha1.json
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: grafana-admin-password
spec:
  length: 48
  digits: 8
  symbols: 0
  noUpper: false
  allowRepeat: true
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/pushsecret_v1alpha1.json
# Seeds Infisical from the generator only while the secret does not exist there.
# Infisical holds the value from then on, so a rebuilt cluster reads the same
# password back.
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: grafana-admin-password
spec:
  updatePolicy: IfNotExists
  secretStoreRefs:
    - kind: ClusterSecretStore
      name: infisical
  selector:
    generatorRef:
      apiVersion: generators.external-secrets.io/v1alpha1
      kind: Password
      name: grafana-admin-password
  data:
    - match:
        secretKey: password
        remoteRef:
          remoteKey: /k8s/GRAFANA_ADMIN_PASSWORD
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin-password
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: grafana-admin-password
  data:
    - secretKey: GF_SECURITY_ADMIN_PASSWORD
      remoteRef:
        key: /k8s/GRAFANA_ADMIN_PASSWORD
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/generators.external-secrets.io/password_v1alpha1.json
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: grafana-secret-key
spec:
  length: 64
  digits: 10
  symbols: 0
  noUpper: false
  allowRepeat: true
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/pushsecret_v1alpha1.json
# Seeds Infisical from the generator only while the secret does not exist there.
# Grafana encrypts data-source secrets in its database with this key, so the
# value in Infisical must outlive the cluster.
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: grafana-secret-key
spec:
  updatePolicy: IfNotExists
  secretStoreRefs:
    - kind: ClusterSecretStore
      name: infisical
  selector:
    generatorRef:
      apiVersion: generators.external-secrets.io/v1alpha1
      kind: Password
      name: grafana-secret-key
  data:
    - match:
        secretKey: password
        remoteRef:
          remoteKey: /k8s/GRAFANA_SECRET_KEY
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-secret-key
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: grafana-secret-key
  data:
    - secretKey: GF_SECURITY_SECRET_KEY
      remoteRef:
        key: /k8s/GRAFANA_SECRET_KEY
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-oauth
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical-shared-global
  target:
    name: grafana-oauth
  data:
    - secretKey: GF_AUTH_GENERIC_OAUTH_CLIENT_ID
      remoteRef:
        key: FUTO_ZITADEL_OAUTH_CLIENT_ID_GRAFANA_O11Y
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rootly-heartbeat
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: rootly-heartbeat
  data:
    - secretKey: url
      remoteRef:
        key: ROOTLY_HEARTBEAT_PING_URL
    - secretKey: token
      remoteRef:
        key: ROOTLY_HEARTBEAT_PING_SECRET
---
