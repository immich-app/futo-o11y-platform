---
# Stable endpoint for the routers' NetBird DNS resolver; CoreDNS forwards
# futo.network to this IP (kubernetes/apps/base/coredns/app/helmrelease.yaml).
apiVersion: v1
kind: Service
metadata:
  name: netbird-dns
spec:
  type: ClusterIP
  clusterIP: 10.96.0.53
  selector:
    app.kubernetes.io/name: netbird-router
  ports:
    - name: dns-udp
      protocol: UDP
      port: 53
      targetPort: 53
    - name: dns-tcp
      protocol: TCP
      port: 53
      targetPort: 53
