---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/apps/daemonset_v1.json
# One Vector per node, receiving that node's Talos service and kernel logs on
# loopback and shipping them to VictoriaLogs (vector.yaml says why Talos needs
# a relay).
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: talos-logs
  labels:
    app.kubernetes.io/name: talos-logs
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: talos-logs
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: talos-logs
    spec:
      # Talos sends to 127.0.0.1, which is only the node's in its network
      # namespace.
      hostNetwork: true
      # The sink is the in-cluster VMAuth, so the relay needs cluster DNS even
      # on the host network. A CoreDNS outage stalls shipping, not collection:
      # Vector's disk buffer holds the lines until it recovers.
      dnsPolicy: ClusterFirstWithHostNet
      automountServiceAccountToken: false
      enableServiceLinks: false
      tolerations:
        - operator: Exists
      containers:
        - name: vector
          # renovate: datasource=docker depName=timberio/vector
          image: timberio/vector:0.61.0-distroless-static@sha256:6901c28cc86ed3d41880198dad12ba7b6df83efdf9c61c0c175d23980689a16f
          args: ["--config", "/etc/vector/vector.yaml"]
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            # From cluster-settings via the cluster-apps postBuild patch.
            - name: CLUSTER_NAME
              value: "${CLUSTER_NAME}"
            - name: CLUSTER_ENV
              value: "${CLUSTER_ENV}"
          ports:
            # Open to VMAgent in the metrics-node host firewall rule.
            - name: metrics
              containerPort: 9598
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            periodSeconds: 30
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /etc/vector
              readOnly: true
            - name: data
              mountPath: /var/lib/talos-logs
      volumes:
        - name: config
          configMap:
            name: talos-logs
        # Vector's disk buffer, on the node so lines not yet shipped survive
        # a pod restart.
        - name: data
          hostPath:
            path: /var/lib/talos-logs
            type: DirectoryOrCreate
