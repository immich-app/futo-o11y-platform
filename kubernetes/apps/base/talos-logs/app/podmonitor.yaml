---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/podmonitor_v1.json
# Vector's own metrics: events sent and dropped, sink errors, buffer size.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: talos-logs
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: talos-logs
  podMetricsEndpoints:
    - port: metrics
