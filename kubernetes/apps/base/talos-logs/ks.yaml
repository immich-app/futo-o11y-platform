---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: talos-logs
  namespace: flux-system
spec:
  # Its sink, the managed VMAuth victoria-logs, comes with victoria-metrics.
  dependsOn:
    - name: victoria-metrics
  interval: 1h
  path: ./kubernetes/apps/base/talos-logs/app
  patches: []
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: true
