---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bootstrap-o11y-bucket
  namespace: flux-system
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: bootstrap-o11y-bucket
  data:
    - secretKey: accesskey
      remoteRef:
        key: FUTO_BOOTSTRAP_RELEASES_S3_READER__ACCESSKEY
    - secretKey: secretkey
      remoteRef:
        key: FUTO_BOOTSTRAP_RELEASES_S3_READER__SECRETKEY
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: Bucket
metadata:
  name: bootstrap-o11y
  namespace: flux-system
spec:
  interval: 1m
  provider: generic
  bucketName: futo-bootstrap-prod-releases
  endpoint: nyc3.digitaloceanspaces.com
  region: nyc3
  prefix: o11y/current/
  secretRef:
    name: bootstrap-o11y-bucket
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: bootstrap-o11y
  namespace: flux-system
spec:
  interval: 10m
  sourceRef:
    kind: Bucket
    name: bootstrap-o11y
  path: ./o11y/current
  patches:
    - target:
        kind: GrafanaFolder
      patch: |-
        - op: add
          path: /spec/permissions
          value: |
            {
              "items": [
                {"role": "Viewer", "permission": 1},
                {"role": "Editor", "permission": 1}
              ]
            }
  prune: true
  targetNamespace: o11y
  dependsOn:
    - name: grafana-operator
