---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/tuppr.home-operations.com/kubernetesupgrade_v1alpha1.json
# Runs talosctl upgrade-k8s in-cluster. Bump kubernetesVersion in
# talos/<env>/topf.yaml in the same change (Renovate groups them), or the next
# topf apply rolls the component images back.
apiVersion: tuppr.home-operations.com/v1alpha1
kind: KubernetesUpgrade
metadata:
  name: kubernetes
spec:
  kubernetes:
    # renovate: datasource=docker depName=ghcr.io/siderolabs/kubelet
    version: v1.37.2
  # Checked once, before the upgrade starts; unlike a TalosUpgrade there is no
  # check between nodes, so watch the stateful workloads while it runs.
  healthChecks:
    - apiVersion: v1
      kind: Node
      expr: status.conditions.exists(c, c.type == "Ready" && c.status == "True")
    - apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      expr: status.phase == "Cluster in healthy state"
    - apiVersion: operator.victoriametrics.com/v1beta1
      kind: VMCluster
      expr: status.updateStatus == "operational"
    - apiVersion: operator.victoriametrics.com/v1
      kind: VLCluster
      expr: status.updateStatus == "operational"
    - apiVersion: operator.victoriametrics.com/v1
      kind: VTCluster
      expr: status.updateStatus == "operational"
    - apiVersion: dragonflydb.io/v1alpha1
      kind: Dragonfly
      expr: status.phase == "Ready"
