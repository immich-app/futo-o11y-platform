---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/tuppr.home-operations.com/talosupgrade_v1alpha1.json
# Upgrades one node at a time; talosctl drains it first. Each node keeps its
# installer flavor and schematic (openstack control planes, metal workers):
# tuppr swaps only the version tag. Bump talosVersion in talos/<env>/topf.yaml
# in the same change (Renovate groups them), so topf renders the installer
# image the nodes run.
apiVersion: tuppr.home-operations.com/v1alpha1
kind: TalosUpgrade
metadata:
  name: talos
spec:
  talos:
    # renovate: datasource=github-releases depName=siderolabs/talos
    version: v1.14.5
  # Checked before the run and before each node, so a node goes down only
  # while the stateful workloads are healthy.
  healthChecks:
    - apiVersion: v1
      kind: Node
      expr: status.conditions.exists(c, c.type == "Ready" && c.status == "True")
    - apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      expr: status.phase == "Cluster in healthy state"
    - apiVersion: operator.victoriametrics.com/v1beta1
      kind: VMCluster
      expr: status.updateStatus == "operational"
    - apiVersion: operator.victoriametrics.com/v1
      kind: VLCluster
      expr: status.updateStatus == "operational"
    - apiVersion: operator.victoriametrics.com/v1
      kind: VTCluster
      expr: status.updateStatus == "operational"
    - apiVersion: dragonflydb.io/v1alpha1
      kind: Dragonfly
      expr: status.phase == "Ready"
