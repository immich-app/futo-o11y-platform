---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/generators.external-secrets.io/fake_v1alpha1.json
# The vmauth gateway URLs that the remote clusters read from the shared
# project's <env>:/tf, next to the vmauth password. Fake is ESO's generator for
# static values.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Fake
metadata:
  name: vmauth-urls
spec:
  data:
    O11Y_VICTORIAMETRICS_VMAUTH_MESH_URL: https://vmauth.${BOOTSTRAP_MESH_DOMAIN}
    O11Y_VICTORIAMETRICS_VMAUTH_PUBLIC_URL: https://vmauth.${CLUSTER_APP_DOMAIN}
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/pushsecret_v1alpha1.json
# This cluster's identity may write only the names that core-infra-tf lists
# for it in kubernetes_shared_writes.
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: vmauth-urls
spec:
  secretStoreRefs:
    - kind: ClusterSecretStore
      name: infisical-shared
  selector:
    generatorRef:
      apiVersion: generators.external-secrets.io/v1alpha1
      kind: Fake
      name: vmauth-urls
  data:
    - match:
        secretKey: O11Y_VICTORIAMETRICS_VMAUTH_MESH_URL
        remoteRef:
          remoteKey: /tf/O11Y_VICTORIAMETRICS_VMAUTH_MESH_URL
    - match:
        secretKey: O11Y_VICTORIAMETRICS_VMAUTH_PUBLIC_URL
        remoteRef:
          remoteKey: /tf/O11Y_VICTORIAMETRICS_VMAUTH_PUBLIC_URL
