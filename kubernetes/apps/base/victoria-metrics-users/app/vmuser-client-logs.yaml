---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/generators.external-secrets.io/password_v1alpha1.json
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: vmuser-client-logs-token
spec:
  length: 48
  digits: 8
  symbols: 0
  noUpper: false
  allowRepeat: true
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/pushsecret_v1alpha1.json
# The write-only logs token of the client shippers, published to the shared
# project's <env>:/tf. Seeds Infisical from the generator only while the secret
# does not exist there; to rotate it, delete it in Infisical and release the
# app with the new value. The cluster's identity needs write on this name in
# the shared project (kubernetes_shared_writes in core-infra-tf), or the first
# seed and every rotation fail.
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: vmuser-client-logs-token
spec:
  updatePolicy: IfNotExists
  secretStoreRefs:
    - kind: ClusterSecretStore
      name: infisical-shared
  selector:
    generatorRef:
      apiVersion: generators.external-secrets.io/v1alpha1
      kind: Password
      name: vmuser-client-logs-token
  data:
    - match:
        secretKey: password
        remoteRef:
          remoteKey: /tf/O11Y_VICTORIALOGS_CLIENT_TOKEN
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vmuser-client-logs-token
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical-shared
  target:
    name: vmuser-client-logs-token
  data:
    - secretKey: token
      remoteRef:
        key: O11Y_VICTORIALOGS_CLIENT_TOKEN
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/operator.victoriametrics.com/vmuser_v1beta1.json
#
# Write-only logs token for shippers that run inside something we do not
# control (today: the Harbor mobile app). A token in an app binary is public,
# so this user can only insert logs, and only under /client/harbor-mobile/ so
# the httproute-client-logs rate limit catches it without touching the
# remote-clusters paths. The identity fields are pinned here: VictoriaLogs
# reads query args before VL-* headers and vmauth's args come first in the
# merged query, so the client cannot relabel itself into another project or
# open a stream per device, and the tenant headers are forced to 0:0 because
# VictoriaLogs reads AccountID/ProjectID from request headers and vmauth's
# headers replace the caller's (docs/05, "Shipping logs from an app").
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMUser
metadata:
  name: client-logs
spec:
  tokenRef:
    name: vmuser-client-logs-token
    key: token
  targetRefs:
    - static:
        url: http://vmauth-victoria-logs.o11y.svc.cluster.local:8427
      paths:
        - /client/harbor-mobile/insert/jsonline
        - /client/harbor-mobile/insert/opentelemetry/v1/logs
      drop_src_path_prefix_parts: 2
      headers:
        - "AccountID: 0"
        - "ProjectID: 0"
      query_args:
        - name: extra_fields
          values:
            ["project=harbor,cluster=harbor-mobile,env=${CLUSTER_ENV},provider=mobile,region=world"]
        - name: _stream_fields
          values: ["project,cluster,env"]
