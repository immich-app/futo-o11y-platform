---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/generators.external-secrets.io/password_v1alpha1.json
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: vmuser-remote-cluster-token
spec:
  length: 48
  digits: 8
  symbols: 0
  noUpper: false
  allowRepeat: true
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/pushsecret_v1alpha1.json
# The shared bearer token of the public gateway, which the remote clusters read
# from the shared project's <env>:/tf. Seeds Infisical from the generator only
# while the secret does not exist there, so the token the remotes hold stays
# until someone deletes it in Infisical to rotate it. The cluster's identity
# needs write on this name in the shared project (kubernetes_shared_writes in
# core-infra-tf), or the first seed and every rotation fail.
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: vmuser-remote-cluster-token
spec:
  updatePolicy: IfNotExists
  secretStoreRefs:
    - kind: ClusterSecretStore
      name: infisical-shared
  selector:
    generatorRef:
      apiVersion: generators.external-secrets.io/v1alpha1
      kind: Password
      name: vmuser-remote-cluster-token
  data:
    - match:
        secretKey: password
        remoteRef:
          remoteKey: /tf/O11Y_VICTORIAMETRICS_VMAUTH_PASSWORD
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vmuser-remote-cluster-token
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical-shared
  target:
    name: vmuser-remote-cluster-token
  data:
    - secretKey: token
      remoteRef:
        key: O11Y_VICTORIAMETRICS_VMAUTH_PASSWORD
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/operator.victoriametrics.com/vmuser_v1beta1.json
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMUser
metadata:
  name: remote-clusters
spec:
  tokenRef:
    name: vmuser-remote-cluster-token
    key: token
  targetRefs:
    - static:
        url: http://vminsert-victoria-metrics.o11y.svc.cluster.local:8480/insert/multitenant
      paths:
        - /insert/0/.*
      drop_src_path_prefix_parts: 2
    # One sample per event from serverless pushers, summed per series per
    # minute by vmagent-serverless before it reaches vminsert (docs/05).
    # Its ingestion endpoints only: vmagent's /flags, /metrics and pprof
    # answer anyone who reaches them. The Service is headless (a stateful
    # VMAgent), so without discovery vmauth sees one backend and cannot
    # take a stopped replica out of rotation or retry on the other one.
    - static:
        url: http://vmagent-serverless.o11y.svc.cluster.local:8429
      paths:
        - /serverless/insert/influx/write
        - /serverless/insert/api/v1/import/prometheus
        - /serverless/insert/api/v1/write
      drop_src_path_prefix_parts: 2
      discover_backend_ips: true
    - static:
        url: http://vmauth-victoria-logs.o11y.svc.cluster.local:8427
      paths:
        - /insert/jsonline
        - /insert/native
        - /insert/elasticsearch/.*
        - /insert/loki/.*
        - /insert/opentelemetry/.*
    # Traces sit under their own /traces/ prefix because OTLP traces and logs
    # share /insert/opentelemetry/, which the route above sends to logs.
    - static:
        url: http://vmauth-victoria-traces.o11y.svc.cluster.local:8427
      paths:
        - /traces/insert/opentelemetry/.*
      drop_src_path_prefix_parts: 1
    - static:
        url: http://vmselect-victoria-metrics.o11y.svc.cluster.local:8481/select/multitenant
      paths:
        - /select/0/.*
      drop_src_path_prefix_parts: 2
    - static:
        url: http://vmauth-victoria-logs.o11y.svc.cluster.local:8427
      paths:
        - /select/logsql/.*
    - static:
        url: http://vmauth-victoria-traces.o11y.svc.cluster.local:8427
      paths:
        - /traces/select/.*
      drop_src_path_prefix_parts: 1
