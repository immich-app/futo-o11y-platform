---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vmuser-remote-cluster-token
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-shared-environment
  target:
    name: vmuser-remote-cluster-token
    template:
      data:
        token: "{{ .password }}"
  dataFrom:
    - extract:
        key: O11Y_VICTORIAMETRICS_VMAUTH_PASSWORD
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/operator.victoriametrics.com/vmuser_v1beta1.json
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMUser
metadata:
  name: remote-clusters
spec:
  tokenRef:
    name: vmuser-remote-cluster-token
    key: token
  targetRefs:
    - static:
        url: http://vminsert-victoria-metrics.o11y.svc.cluster.local:8480/insert/multitenant
      paths:
        - /insert/0/.*
      drop_src_path_prefix_parts: 2
    # One sample per event from serverless pushers, summed per series per
    # minute by vmagent-serverless before it reaches vminsert (docs/05).
    # Its ingestion endpoints only: vmagent's /flags, /metrics and pprof
    # answer anyone who reaches them. The Service is headless (a stateful
    # VMAgent), so without discovery vmauth sees one backend and cannot
    # take a stopped replica out of rotation or retry on the other one.
    - static:
        url: http://vmagent-serverless.o11y.svc.cluster.local:8429
      paths:
        - /serverless/insert/influx/write
        - /serverless/insert/api/v1/import/prometheus
        - /serverless/insert/api/v1/write
      drop_src_path_prefix_parts: 2
      discover_backend_ips: true
    - static:
        url: http://vmauth-victoria-logs.o11y.svc.cluster.local:8427
      paths:
        - /insert/jsonline
        - /insert/native
        - /insert/elasticsearch/.*
        - /insert/loki/.*
        - /insert/opentelemetry/.*
    # Traces sit under their own /traces/ prefix because OTLP traces and logs
    # share /insert/opentelemetry/, which the route above sends to logs.
    - static:
        url: http://vmauth-victoria-traces.o11y.svc.cluster.local:8427
      paths:
        - /traces/insert/opentelemetry/.*
      drop_src_path_prefix_parts: 1
    - static:
        url: http://vmselect-victoria-metrics.o11y.svc.cluster.local:8481/select/multitenant
      paths:
        - /select/0/.*
      drop_src_path_prefix_parts: 2
    - static:
        url: http://vmauth-victoria-logs.o11y.svc.cluster.local:8427
      paths:
        - /select/logsql/.*
    - static:
        url: http://vmauth-victoria-traces.o11y.svc.cluster.local:8427
      paths:
        - /traces/select/.*
      drop_src_path_prefix_parts: 1
