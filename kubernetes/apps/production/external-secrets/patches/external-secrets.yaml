---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: external-secrets
  namespace: flux-system
spec:
  patches:
    - patch: |-
        apiVersion: source.toolkit.fluxcd.io/v1
        kind: OCIRepository
        metadata:
          name: external-secrets
        spec:
          ref:
            # renovate: datasource=docker depName=ghcr.io/external-secrets/charts/external-secrets
            tag: 2.14.0
            digest: sha256:0e3d45f11522f2730ff55deef57bc43e0ff4aadc00bdab5557fa4d354b0c3ab7
      target:
        kind: OCIRepository
        name: external-secrets
    - patch: |-
        - op: replace
          path: /spec/values/extraContainers/0/image
          # renovate: datasource=docker depName=netbirdio/nblink
          value: netbirdio/nblink:0.82.1@sha256:9ef603e0a6fcb26bdaf4015150c03967fba1834683adc556fc6cad08fd0060dd
      target:
        kind: HelmRelease
        name: external-secrets
