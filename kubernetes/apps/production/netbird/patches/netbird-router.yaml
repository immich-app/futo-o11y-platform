---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: netbird-router
  namespace: flux-system
spec:
  patches:
    - patch: |-
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: netbird-router
        spec:
          template:
            spec:
              containers:
                - name: netbird
                  # renovate: datasource=docker depName=netbirdio/netbird
                  image: netbirdio/netbird:0.82.0@sha256:eca5b274c635bfbb04ec6724a0712d1146190dd450eea199eeb83916fdd94965
      target:
        kind: Deployment
        name: netbird-router
