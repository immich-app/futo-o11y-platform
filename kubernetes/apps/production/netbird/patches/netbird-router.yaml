---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: netbird-router
  namespace: flux-system
spec:
  patches:
    - patch: |-
        apiVersion: source.toolkit.fluxcd.io/v1
        kind: OCIRepository
        metadata:
          name: netbird-router
        spec:
          ref:
            # renovate: datasource=docker depName=ghcr.io/bjw-s-labs/helm/app-template
            tag: 5.3.0
            digest: sha256:0e13b145656490310ada364d8eb708e5f4f6384c7deb60d3f5f0fa56950ff63a
      target:
        kind: OCIRepository
        name: netbird-router
    - patch: |-
        apiVersion: helm.toolkit.fluxcd.io/v2
        kind: HelmRelease
        metadata:
          name: netbird-router
        spec:
          values:
            controllers:
              main:
                containers:
                  main:
                    image:
                      # renovate: datasource=docker depName=netbirdio/netbird
                      tag: 0.82.0@sha256:eca5b274c635bfbb04ec6724a0712d1146190dd450eea199eeb83916fdd94965
      target:
        kind: HelmRelease
        name: netbird-router
