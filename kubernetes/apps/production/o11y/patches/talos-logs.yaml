---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: talos-logs
  namespace: flux-system
spec:
  patches:
    - patch: |-
        apiVersion: apps/v1
        kind: DaemonSet
        metadata:
          name: talos-logs
        spec:
          template:
            spec:
              containers:
                - name: vector
                  # renovate: datasource=docker depName=timberio/vector
                  image: timberio/vector:0.61.0-distroless-static@sha256:6901c28cc86ed3d41880198dad12ba7b6df83efdf9c61c0c175d23980689a16f
      target:
        kind: DaemonSet
        name: talos-logs
