---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: victoria-metrics
  namespace: flux-system
spec:
  patches:
    - patch: |-
        apiVersion: source.toolkit.fluxcd.io/v1
        kind: OCIRepository
        metadata:
          name: victoria-metrics
        spec:
          ref:
            # renovate: datasource=docker depName=ghcr.io/victoriametrics/helm-charts/victoria-metrics-k8s-stack
            tag: 0.97.1
            digest: sha256:04f0ecbc002c2d9845c89d3c4b6a0ce9a7a4aa00452743b167d0711daebd89e3
      target:
        kind: OCIRepository
        name: victoria-metrics
    - patch: |-
        apiVersion: helm.toolkit.fluxcd.io/v2
        kind: HelmRelease
        metadata:
          name: victoria-metrics
        spec:
          values:
            vmcluster:
              spec:
                vmstorage:
                  resources:
                    requests:
                      memory: 8Gi
                    limits:
                      memory: 48Gi
                vmselect:
                  resources:
                    requests:
                      memory: 2Gi
                    limits:
                      memory: 32Gi
                  extraArgs:
                    search.maxConcurrentRequests: "8"
      target:
        kind: HelmRelease
        name: victoria-metrics
