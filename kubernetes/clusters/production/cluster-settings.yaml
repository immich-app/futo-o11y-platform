---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-settings
  namespace: flux-system
data:
  CLUSTER_APP_DOMAIN: futostatus.com
  # The bootstrap cluster's service CIDR, which holds every VIP it serves on the mesh
  # (Infisical, opc); owned by infra-bootstrap, hence not in bootstrap-settings.
  CLUSTER_BOOTSTRAP_SERVICE_CIDR: 10.41.16.0/22
  CLUSTER_NAME: o11y
  # Remote cluster whose metrics ping the Rootly remote heartbeat; matches the
  # rootly module's remote_cluster heartbeat for this env.
  CLUSTER_REMOTE_HEARTBEAT: father
  CLUSTER_ENV: prod
  CLUSTER_VMLOGS_RETENTION: 120d
  CLUSTER_VMLOGS_STORAGE_CLASS: openebs-spare-disk-2
  CLUSTER_VMLOGS_SIZE: 500Gi
  CLUSTER_VTRACES_RETENTION: 30d
  CLUSTER_VTRACES_STORAGE_CLASS: openebs-spare-disk-2
  # Whole number with a binary suffix (Gi/Ti): the VTClusters append B to it
  # for VictoriaTraces' disk-usage retention.
  CLUSTER_VTRACES_SIZE: 200Gi
  CLUSTER_GLITCHTIP_S3_BUCKET: futo-o11y-production-glitchtip
  CLUSTER_VMETRICS_RETENTION: 120d
  CLUSTER_VMETRICS_ACCOUNT_ID: "1"
  CLUSTER_VMETRICS_PROJECT_ID: "1"
  QUOTE: '"'
