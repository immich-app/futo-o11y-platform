---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-settings
  namespace: flux-system
data:
  CLUSTER_APP_DOMAIN: staging.futostatus.com
  # Bootstrap-cluster-owned opc VIP (not o11y TF, hence not in bootstrap-settings).
  CLUSTER_OPC_VIP: 10.41.19.250
  # Bootstrap-cluster-owned Infisical and instance-relay VIPs (infisical.futo.network,
  # bootstrap-relay), routed over the mesh egress like opc.
  CLUSTER_INFISICAL_VIP: 10.41.16.37
  CLUSTER_INFISICAL_RELAY_VIP: 10.41.16.38
  CLUSTER_NAME: o11y
  # Remote cluster whose metrics ping the Rootly remote heartbeat; matches the
  # rootly module's remote_cluster heartbeat for this env.
  CLUSTER_REMOTE_HEARTBEAT: luke
  CLUSTER_ENV: staging
  # The cluster's Infisical gateway, created by core-infra-tf (infisical/instance).
  CLUSTER_INFISICAL_GATEWAY_NAME: gw-o11y-staging
  CLUSTER_OP_O11Y_VAULT: o11y_tf_staging
  CLUSTER_OP_SHARED_VAULT: shared_tf_staging
  CLUSTER_VMLOGS_RETENTION: 30d
  CLUSTER_VMLOGS_STORAGE_CLASS: openebs-spare-disk
  CLUSTER_VMLOGS_SIZE: 200Gi
  CLUSTER_VTRACES_RETENTION: 14d
  CLUSTER_VTRACES_STORAGE_CLASS: openebs-spare-disk
  # Whole number with a binary suffix (Gi/Ti): the VTClusters append B to it
  # for VictoriaTraces' disk-usage retention.
  CLUSTER_VTRACES_SIZE: 50Gi
  CLUSTER_GLITCHTIP_S3_BUCKET: futo-o11y-staging-glitchtip
  CLUSTER_VMETRICS_RETENTION: 30d
  CLUSTER_VMETRICS_ACCOUNT_ID: "1"
  CLUSTER_VMETRICS_PROJECT_ID: "1"
  QUOTE: '"'
