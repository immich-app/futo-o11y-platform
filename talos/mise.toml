# The NetBird setup key (NETBIRD_TALOS_SETUP_KEY, which the netbird module
# writes) comes from this environment's /tf in Infisical; topf.yaml resolves it
# through vals, so topf redacts it. `infisical run` would turn topf's exit
# code 2 (changes found) into 1, so only the key is read.
# Args after `--` reach topf, e.g. `mise run //talos:diff -- --nodes-filter cp-gra`.
[tasks.diff]
description = "Show the machine-config changes topf would apply to $ENVIRONMENT (exits 2 when there are changes)"
env = { INFISICAL_PROJECT_ID = "{{vars.infisical_observability}}" }
run = 'NETBIRD_TALOS_SETUP_KEY="$(infisical secrets get NETBIRD_TALOS_SETUP_KEY --silent --log-level warn --env {{vars.env_short}} --path /tf --plain)" topf apply --dry-run'

[tasks.apply]
description = "Apply the machine configs to $ENVIRONMENT, one node at a time, confirming each diff"
env = { INFISICAL_PROJECT_ID = "{{vars.infisical_observability}}" }
run = 'NETBIRD_TALOS_SETUP_KEY="$(infisical secrets get NETBIRD_TALOS_SETUP_KEY --silent --log-level warn --env {{vars.env_short}} --path /tf --plain)" topf apply'

# The rendered files hold the cluster's private keys, so the output dir is
# required (topf's default ./output is inside the repo); use a temp dir.
[tasks.render]
description = "Render $ENVIRONMENT's machine configs, secrets included, into <output>"
usage = 'arg "<output>" help="Directory for the rendered configs (use a temp dir)"'
env = { INFISICAL_PROJECT_ID = "{{vars.infisical_observability}}" }
run = 'NETBIRD_TALOS_SETUP_KEY="$(infisical secrets get NETBIRD_TALOS_SETUP_KEY --silent --log-level warn --env {{vars.env_short}} --path /tf --plain)" topf render --output "$usage_output"'

[tasks.talosconfig]
description = "Write the talosconfig for $ENVIRONMENT to $TALOSCONFIG"
run = '''
#!/usr/bin/env bash
set -euo pipefail
: "${ENVIRONMENT:?set ENVIRONMENT=staging (or production) first}"

umask 077
mkdir -p "$(dirname "$TALOSCONFIG")"
config="$(topf talosconfig)"
printf '%s\n' "$config" >"$TALOSCONFIG"
'''
