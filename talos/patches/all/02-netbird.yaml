---
# NetBird overlay, the node management mesh. Operators reach the vRack IPs
# through the NetBird route (server-side, masqueraded to a routing peer's
# vRack IP). NB_MANAGEMENT_URL mirrors yucca (the Cloud default). The setup
# key comes from the netbird/cluster Terraform output (talos/mise.toml exports
# NETBIRD_SETUP_KEY); topf redacts the resolved value in its output.
apiVersion: v1alpha1
kind: ExtensionServiceConfig
name: netbird
environment:
  - ref+envsubst://NB_SETUP_KEY=$NETBIRD_SETUP_KEY
  - NB_MANAGEMENT_URL=https://api.netbird.io
