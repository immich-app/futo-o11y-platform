# Talos sends its own logs to the talos-logs relay
# (kubernetes/apps/base/talos-logs), which posts them to VictoriaLogs:
# - the service logs (machined, kubelet, etcd, containerd, apid...)
# - the kernel ring buffer (OOM kills, link and disk errors)
# The pod log collector does not see them. Talos can only send them as JSON
# lines over TCP or UDP, and VictoriaLogs cannot read that directly. The
# senders run in the host network namespace, where cluster DNS does not
# resolve, so the endpoint is the pinned ClusterIP of the relay Service.
# kube-proxy routes it to the relay pod on this node. When the relay accepts,
# both inputs replay what their ring buffers still hold, about 1MiB per
# service. Both documents apply without a reboot.
machine:
  logging:
    destinations:
      - endpoint: tcp://10.96.0.60:6050/
        format: json_lines
---
apiVersion: v1alpha1
kind: KmsgLogConfig
name: talos-logs
url: tcp://10.96.0.60:6050/
