---
# Envoy data-plane NodePort, reached by the OVH IPLB on the worker's PUBLIC IP
# (the lb1 order is vrackEligibility=false, so the LB cannot ride the vRack;
# see ovh/account/iplb.tf). Restricted to the IPLB's NAT/source range (OVH
# /ipLoadbalancing/{svc}/natIp = 10.108.0.0/14; confirmed by packet capture:
# the LB connects from 10.110.x.x in that block). Those are OVH-internal
# private IPs, so the public internet cannot reach 30443 directly and cannot
# spoof RFC1918 sources past OVH's edge; the LB is the only ingress path.
# 30443 must match the Envoy Service nodePort.
apiVersion: v1alpha1
kind: NetworkRuleConfig
name: envoy-nodeport
portSelector:
  ports:
    - 30443
  protocol: tcp
ingress:
  - subnet: 10.108.0.0/14
---
# WireGuard hostPort of the netbird-router pods (51820 is the node peer's).
# Mesh peers connect from arbitrary WAN addresses; WireGuard authenticates, so
# the pod drops unmatched packets, not the firewall.
apiVersion: v1alpha1
kind: NetworkRuleConfig
name: netbird-router-wg
portSelector:
  ports:
    - 51821
  protocol: udp
ingress:
  - subnet: 0.0.0.0/0
